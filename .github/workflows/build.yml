name: Build CarPlayMaster Deb (Rootless)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Rootless .deb Package
    runs-on: macos-latest
    env:
      THEOS: ${{ runner.temp }}/theos

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          brew install ldid
          curl -fsSL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz | tar -xJ -C $THEOS/sdks

      - name: Build Rootless Package
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayMaster-Rootless-deb
          path: packages/*.deb
          if-no-files-found: error
