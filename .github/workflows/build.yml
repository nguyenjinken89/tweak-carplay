name: Build CarPlayMaster Deb (Rootless)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Rootless .deb Package
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid dpkg

      - name: Setup Theos
        run: |
          THEOS_DIR="$RUNNER_TEMP/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS_DIR"
          curl -fsSL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz | tar -xJ -C "$THEOS_DIR/sdks"
          echo "THEOS=$THEOS_DIR" >> $GITHUB_ENV

      - name: Build Rootless Package
        run: |
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless messages=yes

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayMaster-Rootless-deb
          path: packages/*.deb
          if-no-files-found: error
